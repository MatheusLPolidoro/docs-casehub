stages:
  - qualidade
  - publicar

variables:
  PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  # Silencia o aviso do MkDocs 2.0 que o `mkdocs-material` imprime em
  # toda execução - ruído do ecossistema, não deste site, e que enterra
  # as linhas úteis do log do job.
  #
  # O nome da variável é `NO_...`, não `DISABLE_...`: são avisos de
  # projetos diferentes, com env vars diferentes. `DISABLE_MKDOCS_2_WARNING`
  # é do `properdocs`, que saiu do projeto junto com o pin do
  # `mkdocs-gen-files` (ver requirements.txt).
  NO_MKDOCS_2_WARNING: 'true'

cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - .cache/pip

# ----------------------------------------------------------- qualidade
build:
  stage: qualidade
  image: python:3.13-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    # `--strict` transforma link quebrado e referência inválida em erro.
    # Sem ele o build fica verde publicando páginas quebradas - que é o
    # modo de falha típico de site de documentação.
    - mkdocs build --strict
  artifacts:
    paths:
      - site
    expire_in: 1 week

# ------------------------------------------------------------ publicar
pages:
  stage: publicar
  image: python:3.13-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
